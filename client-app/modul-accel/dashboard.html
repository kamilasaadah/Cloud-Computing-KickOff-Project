<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accelerometer Monitoring Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5); }
      70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
    }
    .pulse-glow { animation: pulseGlow 2s infinite; }

    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

  <!-- Container utama dashboard -->
  <div class="container mx-auto px-4 py-6 max-w-7xl">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
          Accelerometer Monitoring Dashboard
        </h1>
        <p class="text-gray-400 mt-1">Real-time data accelerometer dari perangkat</p>
      </div>
      <div class="mt-4 md:mt-0 flex items-center gap-4">
        <input id="deviceId" 
               class="bg-gray-800 border border-gray-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/40"
               placeholder="Masukkan Device ID" value="dev-001">
        <button onclick="startMonitoring()" 
                class="bg-emerald-600 hover:bg-emerald-700 px-6 py-2 rounded-lg font-medium transition pulse-glow flex items-center gap-2">
          <i class="fas fa-play text-xs"></i> Start
        </button>
        <button onclick="stopMonitoring()" 
                class="bg-red-600/80 hover:bg-red-700 px-6 py-2 rounded-lg font-medium transition flex items-center gap-2">
          <i class="fas fa-stop text-xs"></i> Stop
        </button>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-4 mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-yellow-400 animate-pulse" id="statusDot"></div>
        <span id="status" class="font-medium">Idle</span>
      </div>
      <div class="text-sm text-gray-400">
        Last update: <span id="lastUpdate">-</span>
      </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-xl p-6 card-hover transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm text-gray-400">Latest X</p>
            <p id="xVal" class="text-3xl font-bold text-emerald-400 mt-1">0.00</p>
          </div>
          <i class="fas fa-wave-square text-emerald-500/40 text-3xl"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-xl p-6 card-hover transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm text-gray-400">Latest Y</p>
            <p id="yVal" class="text-3xl font-bold text-blue-400 mt-1">0.00</p>
          </div>
          <i class="fas fa-wave-square text-blue-500/40 text-3xl"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-xl p-6 card-hover transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm text-gray-400">Latest Z</p>
            <p id="zVal" class="text-3xl font-bold text-pink-400 mt-1">0.00</p>
          </div>
          <i class="fas fa-wave-square text-pink-500/40 text-3xl"></i>
        </div>
      </div>

      <div class="bg-gradient-to-br from-gray-800 to-gray-900 border border-gray-700 rounded-xl p-6 card-hover transition-all">
        <div class="flex justify-between items-start">
          <div>
            <p class="text-sm text-gray-400">Data Points</p>
            <p id="dataCount" class="text-3xl font-bold text-teal-400 mt-1">0</p>
          </div>
          <i class="fas fa-database text-teal-500/40 text-3xl"></i>
        </div>
      </div>
    </div>

    <!-- Main Chart -->
    <div class="bg-gray-800/50 border border-gray-700 rounded-xl p-6 mb-8">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold">Real-time Accelerometer Data</h2>
        <span class="text-sm text-gray-400">Last 60 seconds</span>
      </div>
      <div class="h-96">
        <canvas id="accelChart"></canvas>
      </div>
    </div>

    <!-- Response Log -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-6">
      <h3 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <i class="fas fa-server text-emerald-400"></i>
        Latest API Response
      </h3>
      <pre id="logResponse" class="bg-black/60 p-5 rounded-lg text-sm overflow-auto max-h-64 font-mono text-gray-300 whitespace-pre-wrap break-words">
Menunggu data...
      </pre>
    </div>

    <!-- Tombol Kembali ke Home (baru ditambahkan di sini) -->
    <div class="mt-8 flex justify-center">
      <a href="../../index.html" 
         class="bg-gradient-to-r from-indigo-600 to-purple-700 hover:from-indigo-700 hover:to-purple-800 text-white font-bold py-4 px-10 rounded-2xl transition transform hover:scale-105 shadow-xl flex items-center justify-center gap-3 text-lg">
        <i class="fas fa-home"></i> Kembali ke Home
      </a>
    </div>

  </div>

  <script>
    // === KONFIGURASI ===
    const BASE_URL = "https://script.google.com/macros/s/AKfycbxySS5-lojND4iGPC8mXwi9EDs01mbL50ncC4hT7sfkDZWQC-k3HNuDBtIQmyM7h965/exec";
    const MAX_CHART_POINTS = 120; // ~2 menit jika poll 1 detik

    let monitoring = false;
    let pollInterval = null;
    let latestData = null;
    let chart = null;
    let dataCount = 0;

    function initChart() {
      const ctx = document.getElementById('accelChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [
            { label: 'X Axis', data: [], borderColor: '#10b981', backgroundColor: '#10b98133', tension: 0.2, pointRadius: 0 },
            { label: 'Y Axis', data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f633', tension: 0.2, pointRadius: 0 },
            { label: 'Z Axis', data: [], borderColor: '#ec4899', backgroundColor: '#ec489933', tension: 0.2, pointRadius: 0 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'second', displayFormats: { second: 'HH:mm:ss' } },
              title: { display: true, text: 'Waktu', color: '#9ca3af' },
              ticks: { color: '#9ca3af' },
              grid: { color: 'rgba(255,255,255,0.05)' }
            },
            y: {
              title: { display: true, text: 'g (m/s²)', color: '#9ca3af' },
              ticks: { color: '#9ca3af' },
              grid: { color: 'rgba(255,255,255,0.05)' },
              suggestedMin: -2,
              suggestedMax: 2
            }
          },
          plugins: {
            legend: { labels: { color: '#d1d5db', usePointStyle: true, boxWidth: 10 } },
            tooltip: { mode: 'index', intersect: false }
          },
          animation: { duration: 0 }
        }
      });
    }

    function updateStats(x, y, z) {
      document.getElementById('xVal').innerText = x.toFixed(2);
      document.getElementById('yVal').innerText = y.toFixed(2);
      document.getElementById('zVal').innerText = z.toFixed(2);
      document.getElementById('dataCount').innerText = dataCount;
      document.getElementById('lastUpdate').innerText = new Date().toLocaleTimeString();
    }

    function addDataToChart(t, x, y, z) {
      const time = new Date(t);
      chart.data.labels.push(time);
      chart.data.datasets[0].data.push(x);
      chart.data.datasets[1].data.push(y);
      chart.data.datasets[2].data.push(z);

      if (chart.data.labels.length > MAX_CHART_POINTS) {
        chart.data.labels.shift();
        chart.data.datasets.forEach(ds => ds.data.shift());
      }

      chart.update('none'); // smooth tanpa animasi
    }

    async function pollLatestData() {
      const deviceId = document.getElementById('deviceId').value.trim();
      if (!deviceId) return;

      try {
        const url = `${BASE_URL}?path=telemetry/accel/latest&device_id=${encodeURIComponent(deviceId)}`;
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById('logResponse').innerText = JSON.stringify(data, null, 2);

        if (data.ok && data.data) {
          const { t, x, y, z } = data.data;

          if (!latestData || t > latestData.t) {
            latestData = { t, x, y, z };
            dataCount++;
            updateStats(x, y, z);
            addDataToChart(t, x, y, z);

            document.getElementById('status').innerText = 'Live';
            document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse';
          }
        } else {
          document.getElementById('status').innerText = 'No new data';
          document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-yellow-500';
        }
      } catch (err) {
        document.getElementById('status').innerText = 'Error';
        document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-red-500';
        document.getElementById('logResponse').innerText = `Error: ${err.message}`;
      }
    }

    function startMonitoring() {
      if (monitoring) return;
      const deviceId = document.getElementById('deviceId').value.trim();
      if (!deviceId) {
        alert('Masukkan Device ID!');
        return;
      }

      if (!chart) initChart();
      monitoring = true;
      dataCount = 0;
      latestData = null;

      document.getElementById('status').innerText = 'Connecting...';
      document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-yellow-400 animate-pulse';

      pollLatestData();
      pollInterval = setInterval(pollLatestData, 800); // ~1.25 detik
    }

    function stopMonitoring() {
      if (!monitoring) return;
      monitoring = false;
      clearInterval(pollInterval);

      document.getElementById('status').innerText = 'Stopped';
      document.getElementById('statusDot').className = 'w-3 h-3 rounded-full bg-red-500';
    }
  </script>
</body>
</html>
