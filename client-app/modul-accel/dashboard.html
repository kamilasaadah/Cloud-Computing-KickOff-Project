<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>Accel Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
margin:40px;
background:#f5f5f5;
}

.container{
max-width:900px;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
padding:8px;
width:200px;
}

button{
padding:10px 20px;
margin-left:10px;
cursor:pointer;
}

.data{
font-size:20px;
margin:10px 0;
}

canvas{
margin-top:30px;
}

</style>

</head>

<body>

<div class="container">

<h1>Accelerometer Dashboard</h1>

<label>Device ID</label> <input id="deviceId" placeholder="dev-001">

<button onclick="fetchLatest()">Fetch Latest</button>

<h2>Latest Data From Server</h2>

<div class="data">X : <span id="x">-</span></div>
<div class="data">Y : <span id="y">-</span></div>
<div class="data">Z : <span id="z">-</span></div>
<div class="data">Timestamp : <span id="ts">-</span></div>

<canvas id="chart"></canvas>

</div>

<script>

const API_BASE_URL="https://YOUR_SCRIPT_URL"

const ctx=document.getElementById("chart")

const chart=new Chart(ctx,{
type:"line",
data:{
labels:[],
datasets:[
{
label:"X",
data:[],
borderWidth:2
},
{
label:"Y",
data:[],
borderWidth:2
},
{
label:"Z",
data:[],
borderWidth:2
}
]
},
options:{
responsive:true,
animation:false,
scales:{
y:{
beginAtZero:false
}
}
}
})

// FETCH DATA

async function fetchLatest(){

const deviceId=document.getElementById("deviceId").value

if(!deviceId){
alert("Device ID wajib diisi")
return
}

try{

const res=await fetch(API_BASE_URL+"/telemetry/accel/latest?device_id="+deviceId)

const json=await res.json()

const x=json.x
const y=json.y
const z=json.z
const ts=json.ts

document.getElementById("x").innerText=x
document.getElementById("y").innerText=y
document.getElementById("z").innerText=z
document.getElementById("ts").innerText=new Date(ts).toLocaleTimeString()

addPoint(x,y,z)

}catch(err){

alert("Error fetch data")

}

}

// ADD DATA TO GRAPH

function addPoint(x,y,z){

const time=new Date().toLocaleTimeString()

chart.data.labels.push(time)

chart.data.datasets[0].data.push(x)
chart.data.datasets[1].data.push(y)
chart.data.datasets[2].data.push(z)

if(chart.data.labels.length>25){

chart.data.labels.shift()

chart.data.datasets.forEach(d=>d.data.shift())

}

chart.update()

}

// AUTO REFRESH

setInterval(fetchLatest,3000)

</script>

</body>
</html>
