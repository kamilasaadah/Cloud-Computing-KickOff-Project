<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accelerometer Logger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <style>   
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      70% { box-shadow: 0 0 0 25px rgba(34, 197, 94, 0); }
    }
    .pulse-glow { animation: pulseGlow 2.2s infinite; }
  </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-indigo-950 to-purple-950 min-h-screen text-white flex items-center justify-center p-4 sm:p-6">

  <div class="bg-black/40 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-2xl p-6 sm:p-8 w-full max-w-lg">

    <!-- Header -->
    <div class="text-center mb-8">
      <div class="flex items-center justify-center gap-3 mb-2">
        <i class="fas fa-satellite-dish text-4xl text-emerald-400"></i>
        <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-teal-400">
          Accelerometer Logger
        </h1>
      </div>
      <p class="text-sm opacity-80">Siap untuk Swap Test</p>
    </div>

    <!-- Base URL - PENTING UNTUK SWAP TEST -->
    <div class="mb-6">
      <label class="block text-sm font-medium opacity-90 mb-2 flex items-center gap-2">
        <i class="fas fa-link text-emerald-400"></i> Base URL (Google Apps Script)
      </label>
      <input id="baseUrl" 
             class="w-full p-3.5 rounded-xl bg-black/50 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 transition"
             placeholder="https://script.google.com/macros/s/..."
             value="https://script.google.com/macros/s/AKfycbxySS5-lojND4iGPC8mXwi9EDs01mbL50ncC4hT7sfkDZWQC-k3HNuDBtIQmyM7h965/exec">
    </div>

    <!-- Device ID -->
    <div class="mb-8">
      <label class="block text-sm font-medium opacity-90 mb-2 flex items-center gap-2">
        <i class="fas fa-microchip text-emerald-400"></i> Device ID
      </label>
      <input id="deviceId" 
             class="w-full p-3.5 rounded-xl bg-black/50 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/40 transition"
             placeholder="dev-001" value="dev-001">
    </div>

    <!-- Sensor Values -->
    <div class="grid grid-cols-3 gap-4 mb-10 text-center">
      <div class="bg-black/35 backdrop-blur-lg p-5 rounded-2xl border border-emerald-500/30 hover:border-emerald-500/60 transition-all">
        <p class="text-xs opacity-70 mb-1">X Axis</p>
        <p id="xVal" class="text-3xl font-extrabold text-emerald-300">0.00</p>
      </div>
      <div class="bg-black/35 backdrop-blur-lg p-5 rounded-2xl border border-emerald-500/30 hover:border-emerald-500/60 transition-all">
        <p class="text-xs opacity-70 mb-1">Y Axis</p>
        <p id="yVal" class="text-3xl font-extrabold text-emerald-300">0.00</p>
      </div>
      <div class="bg-black/35 backdrop-blur-lg p-5 rounded-2xl border border-emerald-500/30 hover:border-emerald-500/60 transition-all">
        <p class="text-xs opacity-70 mb-1">Z Axis</p>
        <p id="zVal" class="text-3xl font-extrabold text-emerald-300">0.00</p>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row gap-4 mb-8">
      <button onclick="startLogging()" 
              class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-5 px-8 rounded-2xl transition transform hover:scale-105 shadow-xl flex items-center justify-center gap-3 pulse-glow text-lg">
        <i class="fas fa-play"></i> Mulai Logging
      </button>
      <button onclick="stopLogging()" 
              class="flex-1 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-700 hover:to-rose-700 text-white font-bold py-5 px-8 rounded-2xl transition transform hover:scale-105 shadow-xl flex items-center justify-center gap-3 text-lg">
        <i class="fas fa-stop"></i> Stop
      </button>
    </div>

    <!-- Status -->
    <div class="text-center mb-6">
      <p class="text-sm opacity-80">Status:</p>
      <p id="status" class="text-lg font-semibold text-yellow-300">Idle</p>
    </div>

    <!-- Server Response -->
    <div>
      <p class="text-sm mb-3 opacity-90 flex items-center gap-2">
        <i class="fas fa-server text-emerald-400"></i> Respon Server
      </p>
      <pre id="logResponse" class="bg-black/60 backdrop-blur-sm p-5 rounded-2xl text-sm h-48 overflow-y-auto border border-white/10 whitespace-pre-wrap break-words font-mono">
Siap untuk Swap Test...
      </pre>
    </div>

    <!-- Tombol Kembali ke Home -->
    <div class="mt-8 flex justify-center">
      <a href="../../index.html" 
         class="bg-gradient-to-r from-indigo-600 to-purple-700 hover:from-indigo-700 hover:to-purple-800 text-white font-bold py-4 px-10 rounded-2xl transition transform hover:scale-105 shadow-xl flex items-center justify-center gap-3 text-lg">
        <i class="fas fa-home"></i> Kembali ke Home
      </a>
    </div>

  </div>

  <script>
    let samples = [];
    let logging = false;
    let batchInterval = null;
    let latest = { x: 0, y: 0, z: 0 };
    let lastSampleTime = 0;

    function updateDisplay(x, y, z) {
      document.getElementById("xVal").innerText = x.toFixed(2);
      document.getElementById("yVal").innerText = y.toFixed(2);
      document.getElementById("zVal").innerText = z.toFixed(2);
    }

    function motionHandler(event) {
      if (!logging) return;

      const now = Date.now();
      if (now - lastSampleTime < 200) return; // ~5 sampel per detik

      lastSampleTime = now;

      let x = event.accelerationIncludingGravity?.x || 0;
      let y = event.accelerationIncludingGravity?.y || 0;
      let z = event.accelerationIncludingGravity?.z || 0;

      latest = { x, y, z };
      updateDisplay(x, y, z);

      samples.push({ t: now, x, y, z });
    }

    async function startLogging() {
      if (logging) return;

      const baseUrl = document.getElementById("baseUrl").value.trim();
      const deviceId = document.getElementById("deviceId").value.trim();

      if (!baseUrl) {
        alert("Masukkan Base URL terlebih dahulu!");
        return;
      }
      if (!deviceId) {
        alert("Masukkan Device ID terlebih dahulu!");
        return;
      }

      // Izin sensor untuk iOS
      if (typeof DeviceMotionEvent?.requestPermission === "function") {
        try {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission !== "granted") {
            alert("Izin akses sensor ditolak");
            return;
          }
        } catch (e) {
          alert("Error meminta izin sensor: " + e.message);
          return;
        }
      }

      window.addEventListener("devicemotion", motionHandler);
      logging = true;

      document.getElementById("status").innerText = "Mengumpulkan data...";
      document.getElementById("status").className = "text-lg font-semibold text-emerald-400 animate-pulse";

      batchInterval = setInterval(() => sendBatch(baseUrl, deviceId), 5000);
    }

    function stopLogging() {
      if (!logging) return;

      logging = false;
      window.removeEventListener("devicemotion", motionHandler);
      clearInterval(batchInterval);

      document.getElementById("status").innerText = "Stopped";
      document.getElementById("status").className = "text-lg font-semibold text-red-400";
    }

    async function sendBatch(baseUrl, deviceId) {
      if (samples.length === 0) return;

      const batch = samples;
      samples = [];

      document.getElementById("status").innerText = `Mengirim ${batch.length} sampel...`;
      document.getElementById("status").className = "text-lg font-semibold text-yellow-300 animate-pulse";

      const body = new URLSearchParams({
        path: "telemetry/accel",
        device_id: deviceId,
        ts: new Date().toISOString(),
        samples: JSON.stringify(batch)
      });

      try {
        const res = await fetch(baseUrl, { 
          method: "POST", 
          body 
        });

        const data = await res.json();

        const accepted = data?.data?.accepted || batch.length;
        document.getElementById("status").innerText = `Berhasil kirim ${accepted} data`;
        document.getElementById("status").className = "text-lg font-semibold text-emerald-400";

        document.getElementById("logResponse").innerText = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("status").innerText = "Gagal mengirim ke server";
        document.getElementById("status").className = "text-lg font-semibold text-red-400";
        document.getElementById("logResponse").innerText = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
